<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-red: hsl(0, 100%, 74%);
        --color-blue: hsl(248, 32%, 49%);
        --color-green: hsl(154, 59%, 51%);
        --color-darkblue: hsl(249, 10%, 26%);
        --font-poppins: "Poppins", "sans-serif";
        --color-grayishblue: hsl(246, 25%, 77%);
      }
    </style>
  </head>
  <body class="bg-[url(/images/bg-intro-desktop.png)] ... bg-red font-poppins">
    <div
      class="w-[90%] md:w-[1100px] gap-[50px] md:h-[600px] m-auto my-[50px] md:flex items-center md:gap-0"
    >
      <div
        class="text-center flex flex-col gap-5 p-4 text-white md:ps-16 md:text-left"
      >
        <h1 class="text-3xl md:text-5xl font-bold">
          Learn to code by watching others
        </h1>
        <p class="text-sm/6">
          See how experienced developers solve problems in real-time. Watching
          scripted tutorials id great, but understanding how developers think is
          invaluable.
        </p>
      </div>
      <div class="flex flex-col gap-5 text-center">
        <div
          class="p-4 bg-blue text-white rounded-md drop-shadow-[0px_6px_rgba(0,0,0,0.20)]"
        >
          <p>Try it free 7 days then $20/mo. thereafter</p>
        </div>
        <div
          class="md:w-[540px] md:h-[470px] flex flex-col p-10 gap-5 bg-white rounded-xl drop-shadow-[0px_6px_rgba(0,0,0,0.20)]"
        >
          <input
            type="text"
            class="border p-3 rounded-md focus:outline-none focus:border-blue focus:border"
            placeholder="First Name"
          />
          <input
            type="text"
            class="border p-3 rounded-md focus:outline-none focus:border-blue focus:border"
            placeholder="Last Name"
          />
          <input
            type="text"
            class="border p-3 rounded-md focus:outline-none focus:border-blue focus:border"
            placeholder="Email Address"
          />
          <input
            type="text"
            class="border p-3 rounded-md focus:outline-none focus:border-darkblue focus:border"
            placeholder="Password"
          />
          <button
            class="bg-green p-3 rounded-md text-white drop-shadow-[0px_1px_rgba(0,0,0,0.0)] cursor-pointer"
          >
            CLAIM YOUR FREE TRIAL
          </button>
          <p class="text-xs text-grayishblue">
            By clicking the button, you are agreeingto our
            <span class="text-red font-bold">Terms and Services.</span>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
